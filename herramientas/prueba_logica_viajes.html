<!doctype html>
<!-- ==================================================
     PRUEBA SIN BASE DE DATOS: lógica de viajes y palabras
     Abre este archivo en el navegador (doble clic): muestra OK / MAL por cada prueba.
     Prueba precios por franja, recargos, costos por vehículo, viajes/pedidos de la
     empresa y el cambio "Pedido -> Viaje" (js/viajes-comun.js, js/palabras.js).
     No toca Supabase (la conexión se reemplaza por una de mentira).
     ================================================== -->
<meta charset="utf-8">
<title>Prueba de lógica de viajes</title>
<body style="font-family: Consolas, monospace; padding: 16px">
<p id="menu">Pedidos · Crear Pedido · PEDIDOS · Asignar Piloto · pilotos</p>
<pre id="r" data-sin-palabras></pre>
<script>
window.onerror = (m, s, l) => { document.getElementById('r').textContent += `ERROR ${m} (${s}:${l})\n`; };
const respuesta = { data: [], error: null };
const consulta = { select() { return this; }, eq() { return this; }, order() { return this; }, then(r) { return Promise.resolve(respuesta).then(r); } };
var db = { from: () => consulta, rpc: () => Promise.resolve(respuesta) };
function empresaActual() { return { id: 2, codigo: '02', nombre: 'Transportes del Valle', actividades: ['transporte'] }; }
</script>
<script src="../empresas/empresas.js"></script>
<script src="../js/componentes.js"></script>
<script src="../js/palabras.js"></script>
<script src="../js/viajes-comun.js"></script>
<script>
const r = [];
const ok = (n, c, v) => r.push(`${c ? 'OK   ' : 'MAL  '}${n}${c ? '' : `  -> ${JSON.stringify(v)}`}`);

// Franjas y recargos
const f = { minimo: 2500, cargo_base: 0, precio_km: 450 };
ok('precio 3 km = mínimo 2500', precioFranja(f, 3, { redondeo: 100 }) === 2500, precioFranja(f, 3, { redondeo: 100 }));
ok('precio 12 km = 5400', precioFranja(f, 12, { redondeo: 100 }) === 5400, precioFranja(f, 12, { redondeo: 100 }));
ok('precio 12.3 km se redondea a 5600', precioFranja(f, 12.3, { redondeo: 100 }) === 5600, precioFranja(f, 12.3, { redondeo: 100 }));
const rec = recargosViaje({ personas: 3, mascotas: 1, mercaderia: true },
    { pasajeros_incluidos: 1, recargo_pasajero: 500, recargo_mercaderia: 1000, recargo_mascota: 700 });
ok('recargos 2 × 500 + 1000 + 700 = 2700', rec.total === 2700, rec);
ok('días "Lun a Sáb"', textoDias([1, 2, 3, 4, 5, 6]) === 'Lun a Sáb', textoDias([1, 2, 3, 4, 5, 6]));
ok('días sueltos', textoDias([1, 3, 5]) === 'Lun, Mié, Vie', textoDias([1, 3, 5]));
ok('todos los días', textoDias([1, 2, 3, 4, 5, 6, 7]) === 'Todos los días', textoDias([1, 2, 3, 4, 5, 6, 7]));

// Costos: 2 vehículos; gasto general fijo 20000 (10000 a cada uno); al 1: fijo 50000 y variable 30000
const veh = [{ id: 1, horas_mes: 200, km_mes: 3000, km_por_litro: 10 }, { id: 2, horas_mes: 0, km_mes: 0 }];
const cos = [{ vehiculo_id: null, tipo: 'fijo', monto_mes: 20000 }, { vehiculo_id: 1, tipo: 'fijo', monto_mes: 50000 },
    { vehiculo_id: 1, tipo: 'variable', monto_mes: 30000 }];
const c = costosPorVehiculo(veh, cos, { precio_litro: 800, velocidad_kmh: 30 }, [{ vehiculo_id: 1, estado: 'terminado', km: 100, minutos: 600 }]);
const c1 = c.porVehiculo.get(1);
ok('gasto fijo del vehículo 1 = 60000', c1.fijos === 60000, c1);
ok('costo por hora = 60000 ÷ 200 = 300', c1.costoHora === 300, c1.costoHora);
ok('costo por km = 30000 ÷ 3000 + 800 ÷ 10 = 90', Math.abs(c1.costoKm - 90) < 1e-9, c1.costoKm);
ok('real: 10 horas en 30 días -> 6000 por hora', c1.costoHoraReal === 6000, c1.costoHoraReal);
ok('sin horas al mes -> sin costo por hora', c.porVehiculo.get(2).costoHora === null, c.porVehiculo.get(2));
ok('viaje de 30 min y 10 km = 150 + 900', Math.abs(costoDeViaje({ minutos: 30, km: 10 }, c1) - 1050) < 1e-9, costoDeViaje({ minutos: 30, km: 10 }, c1));

// Viajes o pedidos según la empresa
ok('transporte trabaja con viajes', esActividadDeViajes('transporte') === true);
ok('tienda no trabaja con viajes', esActividadDeViajes('tienda') === false);
ok('empresa solo de transporte: tiene viajes', empresaTieneViajes() === true);
ok('empresa solo de transporte: no tiene pedidos', empresaTienePedidos() === false);
ok('actividadesDePedidos deja fuera transporte', actividadesDePedidos([{ codigo: 'tienda' }, { codigo: 'transporte' }]).length === 0);

// Palabras (Pedido -> Viaje)
palabrasActividades = { transporte: { registro: 'viaje', registros: 'viajes', conductor: 'conductor', conductores: 'conductores', viajes: true } };
refrescarPalabras();
const frase = 'Crear Pedido de 3 pedidos · PEDIDOS · el piloto';
ok('cambiarPalabras', cambiarPalabras(frase) === 'Crear Viaje de 3 viajes · VIAJES · el conductor', cambiarPalabras(frase));
ok('no toca palabras parecidas', cambiarPalabras('Pedidora pilotear') === 'Pedidora pilotear', cambiarPalabras('Pedidora pilotear'));

setTimeout(() => {
    const menu = document.getElementById('menu').textContent;
    ok('la pantalla se traduce', menu === 'Viajes · Crear Viaje · VIAJES · Asignar Conductor · conductores', menu);
    ok('nombre de la empresa al exportar', nombreEmpresaExportar() === 'Transportes del Valle', nombreEmpresaExportar());
    document.getElementById('r').textContent += r.join('\n');
}, 300);
</script>
</body>

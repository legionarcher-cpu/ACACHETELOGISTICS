<!-- ==================================================
     SECCIÓN: TIENDAS
     Lista las tiendas agrupadas por región (locación) y permite
     crearlas, modificarlas y eliminarlas (tabla "tiendas" de Supabase).
     Administrador: crear, modificar (incluido el código) y eliminar.
     Admin G1: crear y modificar datos. Admin G2: solo ve su región.
     Empleados y pilotos: solo ven.
     Cada tienda tiene un código REGIÓN-NÚMERO (ej. NOR-001).

     Solo lleva el contenido: sin <html>, <head> ni <body>.
       Estilos propios -> css/secciones/tiendas.css (clases "tnd-")
       Estilos comunes -> css/componentes.css (pagina, boton, tabla, campo, dialogo...)
       Lógica          -> js/secciones/tiendas.js
     Los ids empiezan con "tnd" para no chocar con otras secciones.
     ================================================== -->

<!-- Si se abre este archivo directamente, redirige a index.html
     (cuando index lo carga, esta línea no se ejecuta). -->
<script>if (!document.querySelector('.cuerpo-principal')) location.replace('../index.html');</script>

<div class="pagina">

    <!-- ---------- Encabezado: título, filtro de región, buscador y botón "Nueva" ---------- -->
    <div class="pagina-cabecera">
        <div>
            <h2 class="pagina-titulo">Tiendas</h2>
            <p id="tndContador" class="pagina-subtitulo">Cargando tiendas...</p>
        </div>

        <div class="pagina-acciones">
            <!-- Las regiones las carga el JS desde la tabla "regiones" -->
            <select id="tndFiltroRegion" class="campo-input filtro" aria-label="Filtrar por región">
                <option value="">Todas las regiones</option>
            </select>

            <div class="buscador">
                <i class="bi bi-search"></i>
                <input id="tndBuscar" type="search" class="buscador-input"
                       placeholder="Buscar por código, nombre o dirección" aria-label="Buscar tiendas">
            </div>

            <!-- Abre la sección Clientes con el formulario "Nuevo cliente"
                 (los clientes de cada tienda se ven con el botón de cada fila) -->
            <a href="#clientes?nuevo=1" id="tndAgregarClientes" class="boton boton-secundario">
                <i class="bi bi-person-plus"></i>
                <span>Agregar clientes</span>
            </a>

            <button type="button" id="tndNueva" class="boton boton-principal">
                <i class="bi bi-shop"></i>
                <span>Nueva tienda</span>
            </button>
        </div>
    </div>

    <!-- Mensajes de "Tienda creada", errores, etc. (los pone el JS) -->
    <p id="tndAviso" class="aviso" role="status"></p>

    <!-- ---------- Tabla de tiendas ----------
         El JS arma un grupo (<tbody>) por cada región con su título. -->
    <div class="tabla-caja">
        <table id="tndTabla" class="tabla tnd-tabla">
            <thead>
                <tr>
                    <th>Código</th>
                    <th>Nombre</th>
                    <th>Dirección</th>
                    <th>Teléfono</th>
                    <th class="tnd-col-numero">Usuarios</th>
                    <th>Estado</th>
                    <th class="tabla-col-acciones">Acciones</th>
                </tr>
            </thead>
        </table>
    </div>
</div>

<!-- ==================================================
     VENTANA: CREAR / MODIFICAR TIENDA
     ================================================== -->
<dialog id="tndDialogo" class="dialogo" aria-labelledby="tndDialogoTitulo">
    <form id="tndForm" class="dialogo-form" novalidate>
        <h3 id="tndDialogoTitulo" class="dialogo-titulo">Nueva tienda</h3>

        <div class="campos">
            <!-- Región + número = código (ej. NOR + 004 = NOR-004).
                 Si el administrador lo cambia en una tienda existente, sus
                 usuarios se renombran solos (ej. cen-001-jperez -> nor-004-jperez). -->
            <div class="campo">
                <label for="tndRegion" class="campo-etiqueta">Región *</label>
                <select id="tndRegion" class="campo-input" required></select>
            </div>

            <div class="campo">
                <label for="tndNumero" class="campo-etiqueta">Número *</label>
                <input id="tndNumero" type="text" inputmode="numeric" maxlength="3"
                       class="campo-input" autocomplete="off" placeholder="001" required>
            </div>

            <div class="campo-ancho">
                <small id="tndCodigoAyuda" class="campo-ayuda">
                    Código de la tienda: <strong id="tndVistaPrevia" class="tnd-vista-previa">—</strong>
                </small>
                <!-- Advertencia al cambiar el código de una tienda con usuarios (la pone el JS) -->
                <p id="tndAvisoCodigo" class="tnd-aviso-codigo" hidden></p>
            </div>

            <div class="campo campo-ancho">
                <label for="tndNombre" class="campo-etiqueta">Nombre *</label>
                <input id="tndNombre" type="text" class="campo-input" autocomplete="off" required>
            </div>

            <div class="campo campo-ancho">
                <label for="tndDireccion" class="campo-etiqueta">Dirección</label>
                <input id="tndDireccion" type="text" class="campo-input" autocomplete="off">
            </div>

            <div class="campo">
                <label for="tndTelefono" class="campo-etiqueta">Teléfono</label>
                <input id="tndTelefono" type="tel" class="campo-input" autocomplete="off">
            </div>

            <div class="campo">
                <label for="tndEstado" class="campo-etiqueta">Estado</label>
                <select id="tndEstado" class="campo-input">
                    <option value="activa">Activa</option>
                    <option value="inactiva">Inactiva</option>
                </select>
            </div>
        </div>

        <!-- Error del formulario (ej. "Ya existe una tienda con ese código") -->
        <p id="tndFormError" class="form-error" role="alert"></p>

        <div class="dialogo-botones">
            <button type="button" id="tndCancelar" class="boton boton-secundario">Cancelar</button>
            <button type="submit" id="tndGuardar" class="boton boton-principal">Guardar</button>
        </div>
    </form>
</dialog>

<!-- ==================================================
     VENTANA: CONFIRMAR ELIMINACIÓN
     ================================================== -->
<dialog id="tndConfirmar" class="dialogo dialogo-chico" aria-labelledby="tndConfirmarTitulo">
    <h3 id="tndConfirmarTitulo" class="dialogo-titulo">Eliminar tienda</h3>
    <p id="tndConfirmarTexto" class="dialogo-texto"></p>
    <div class="dialogo-botones">
        <button type="button" id="tndNoEliminar" class="boton boton-secundario">Cancelar</button>
        <button type="button" id="tndSiEliminar" class="boton boton-peligro">Eliminar</button>
    </div>
</dialog>

<!-- ==================================================
     SECCIÓN: PILOTOS
     Lista automáticamente a todos los usuarios con rol "piloto",
     agrupados por tienda. Un piloto aparece aquí apenas se crea
     (o se le cambia el rol a Piloto) en la sección Usuarios.
     Sus datos (nombre, usuario, tienda, vehículo, foto) se
     modifican en Usuarios. Aquí se asignarán sus FUNCIONES
     cuando se definan.

     Solo lleva el contenido: sin <html>, <head> ni <body>.
       Estilos propios -> css/secciones/pilotos.css (clases "plt-")
       Estilos comunes -> css/componentes.css (pagina, tabla, avatar, etiqueta...)
       Lógica          -> js/secciones/pilotos.js
     Los ids empiezan con "plt" para no chocar con otras secciones.
     ================================================== -->

<!-- Si se abre este archivo directamente, redirige a index.html
     (cuando index lo carga, esta línea no se ejecuta). -->
<script>if (!document.querySelector('.cuerpo-principal')) location.replace('../index.html');</script>

<div class="pagina">

    <!-- ---------- Encabezado: título, filtro de región y buscador ---------- -->
    <div class="pagina-cabecera">
        <div>
            <h2 class="pagina-titulo">Pilotos</h2>
            <p id="pltContador" class="pagina-subtitulo">Cargando pilotos...</p>
        </div>

        <div class="pagina-acciones">
            <!-- Las regiones las carga el JS desde la tabla "regiones" -->
            <select id="pltFiltroRegion" class="campo-input filtro" aria-label="Filtrar por región">
                <option value="">Todas las regiones</option>
            </select>

            <div class="buscador">
                <i class="bi bi-search"></i>
                <input id="pltBuscar" type="search" class="buscador-input"
                       placeholder="Buscar por nombre, usuario, tienda o placa" aria-label="Buscar pilotos">
            </div>
        </div>
    </div>

    <!-- Mensajes de error (los pone el JS) -->
    <p id="pltAviso" class="aviso" role="status"></p>

    <!-- Nota para quien administra: dónde se crean y modifican los pilotos -->
    <p class="plt-nota">
        <i class="bi bi-info-circle"></i>
        Los pilotos se crean y modifican en <a href="#usuarios">Usuarios</a> (rol "Piloto").
        Las funciones de cada piloto se asignarán aquí más adelante.
    </p>

    <!-- ---------- Tabla de pilotos ----------
         El JS arma un grupo (<tbody>) por cada tienda con su título. -->
    <div class="tabla-caja">
        <table id="pltTabla" class="tabla plt-tabla">
            <thead>
                <tr>
                    <th class="plt-col-foto" aria-label="Foto"></th>
                    <th>Nombre</th>
                    <th>Usuario</th>
                    <th>Teléfono</th>
                    <th>Vehículo</th>
                    <th>Funciones</th>
                </tr>
            </thead>
        </table>
    </div>
</div>
